<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Readiness Screen Tracker{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="app-header">
    <span class="brand" style="display:flex; align-items:center; gap:0.6rem;">
      <span class="brand-mark">O</span>
      <span>Readiness Screen <span style="color:var(--text-muted); font-weight:500; font-size:0.78rem;">· Octane</span></span>
    </span>
    <nav style="display:flex; gap:0.25rem;">
      <a class="nav-link {% if active_page == 'maintenance' %}active{% endif %}" href="{{ url_for('maintenance.page') }}">Maintenance</a>
      <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard.page') }}">Dashboard</a>
    </nav>
    <div class="header-right" style="margin-left:auto; color: var(--text-muted); font-size: 0.83rem; display:flex; align-items:center; gap:0.55rem;">
      {% block header_right %}{% endblock %}
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
